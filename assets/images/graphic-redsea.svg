<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <pattern id="grid-light" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="currentColor" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--art-bg-start, #F5F1E8)"/>
      <stop offset="100%" stop-color="var(--art-bg-end, #EDE7DB)"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle warm tone -->
  <rect width="800" height="450" rx="8" fill="url(#card-grad)"/>
  <!-- Subtle architectural grid lines -->
  <rect width="800" height="450" rx="8" fill="url(#grid-light)"/>
  <!-- Signature Editorial Orange Circle / Arc -->
  <path d="M 800 230 A 220 220 0 0 0 580 450 L 800 450 Z" fill="#FA4616"/>
  <!-- Subtle line abstraction -->
  <path d="M 100 350 L 450 350" stroke="currentColor" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="100" cy="350" r="4" fill="#FA4616" fill-opacity="0.8"/>
</svg>
